name: Verify console visual layouts

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'resources/admin/**'
      - 'scripts/create_visual_review_gallery.py'
      - '.github/workflows/verify-console-visual.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'resources/admin/**'
      - 'resources/web2/**'
      - '.github/workflows/verify-console-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install simplified Chinese fonts
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --silent --show-error --retry 4 --connect-timeout 20 \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" \
            --output "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -F 'Noto Sans CJK SC'
      - name: Install Chromium test framework
        run: |
          npm --prefix resources/admin install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.0
          resources/admin/node_modules/.bin/playwright install --with-deps chromium
      - name: Build current WebClient connection engine
        run: |
          npm ci --prefix resources/web/js --no-audit --no-fund
          npm run build --prefix resources/web/js
      - name: Check responsive screens, forms, and data tables
        env:
          RUSTDESK_VISUAL_AUDIT: '1'
          RUSTDESK_REQUIRE_CJK_FONT: '1'
        run: node --test resources/admin/browser.e2e.cjs
      - name: Create contact sheets for every audited page
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/create_visual_review_gallery.py \
            resources/admin/test-screenshots/audit \
            resources/admin/test-screenshots/contact-sheets
      - name: Save screenshots on the isolated visual review branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/rustdesk-console-review"
          mkdir -p "$WORK"
          test -f resources/admin/test-screenshots/audit/layout-report.json
          cp -R resources/admin/test-screenshots/audit "$WORK/screenshots"
          cp -R resources/admin/test-screenshots/contact-sheets "$WORK/gallery"
          cd "$WORK"
          git init -b visual-review
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots gallery
          git commit -m "管理和个人页面视觉审核图集"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push --force "https://github.com/$GITHUB_REPOSITORY.git" \
            HEAD:refs/heads/audit/console-visual-review
      - name: Upload inspection reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-console-responsive-visual-audit
          path: resources/admin/test-screenshots/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
