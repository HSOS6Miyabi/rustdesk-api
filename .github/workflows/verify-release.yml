name: Verify and release RustDesk API

on:
  push:
    branches:
      - master
      - feature/modern-console-2026
  pull_request:
  workflow_dispatch:
    inputs:
      milestone_release:
        description: 'Confirm publication of a milestone from a v* tag'
        type: boolean
        default: false
        required: true

concurrency:
  group: rustdesk-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify JavaScript syntax
        run: |
          test -s resources/admin/index.html
          test -s resources/admin/app.js
          test -s resources/web2/index.html
          node --check resources/admin/app.js
          node --check resources/web2/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build WebClient connection engine
        working-directory: resources/web/js
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: WebRTC protocol and data-channel tests
        working-directory: resources/web/js
        run: node --test tests/webrtc.test.cjs tests/websock.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: webclient-js-bundle
          path: resources/web/js/dist
          if-no-files-found: error
      - name: Restore dependency checksums
        run: go mod tidy
      - name: Save dependency checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/modern-console-2026'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m "build: record Go module checksums"
            git push
          fi
      - name: Frontend interaction tests
        run: node --test resources/admin/app.test.cjs resources/web2/app.test.cjs
      - name: Go tests
        run: go test ./... -count=1
      - name: Build executable
        run: go build -o /tmp/rustdesk-api ./cmd/apimain.go

  browser-e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test framework
        run: |
          npm --prefix resources/admin install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.0
          resources/admin/node_modules/.bin/playwright install --with-deps chromium
      - name: Install WebRTC client dependencies
        run: npm ci --prefix resources/web/js --no-audit --no-fund
      - name: Test desktop, tablet and mobile layouts
        run: node --test resources/admin/browser.e2e.cjs
      - name: Retain UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-admin-browser-screenshots
          path: resources/admin/test-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain browser test assets for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-admin-browser-fixtures
          path: |
            resources/admin/index.html
            resources/admin/style.css
            resources/admin/app.js
            resources/admin/favicon.svg
            resources/admin/browser.e2e.cjs
          retention-days: 3
      - name: Test WebRTC media transport in Chromium
        run: node --test resources/admin/browser.webrtc.e2e.cjs

  build:
    needs: [test, browser-e2e]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
          - runner: windows-2022
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webclient-js-bundle
          path: resources/web/js/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compute release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
              echo "tag=v3.0.0-api.103" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v3.0.0-api.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install Linux ARM64 compiler
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Restore dependency checksums
        run: go mod tidy
      - name: Compile Linux
        if: matrix.goos == 'linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          if [ "$GOARCH" = "arm64" ]; then export CC=aarch64-linux-gnu-gcc; fi
          mkdir -p dist/package/data dist/package/runtime
          go build -trimpath -ldflags="-s -w" -o dist/package/apimain ./cmd/apimain.go
          cp -r conf docs resources dist/package/
          cd dist
          tar -czf rustdesk-api-${{ steps.version.outputs.tag }}-${GOOS}-${GOARCH}.tar.gz package
      - name: Compile Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '1'
        run: |
          New-Item -ItemType Directory -Force dist/package/data, dist/package/runtime | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/package/apimain.exe ./cmd/apimain.go
          Copy-Item -Recurse conf, docs, resources dist/package/
          Compress-Archive -Path dist/package -DestinationPath "dist/rustdesk-api-${{ steps.version.outputs.tag }}-windows-amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/rustdesk-api-*
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.milestone_release && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'release-milestone-api-20261110'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: api-*
          merge-multiple: true
          path: dist
      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
              echo "tag=v3.0.0-api.103" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v3.0.0-api.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: dist/rustdesk-api-*

  docker:
    needs: [test, build]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.milestone_release && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'release-milestone-api-20261110'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-linux-${{ matrix.arch }}
          path: docker-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: webclient-js-bundle
          path: resources/web/js/dist
      - name: Prepare executable
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(find docker-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          mkdir -p docker-bin
          tar -xzf "$ARCHIVE" -C docker-bin --strip-components=1 package/apimain
          test -s docker-bin/apimain
          chmod 755 docker-bin/apimain
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
              echo "tag=v3.0.0-api.103" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v3.0.0-api.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}-${{ matrix.arch }}

  docker-manifest:
    needs: docker
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.milestone_release && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'release-milestone-api-20261110'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/master" ]]; then
              TAG="v3.0.0-api.103"
            else
              TAG="v3.0.0-api.$GITHUB_RUN_NUMBER"
            fi
          fi
          TAGS=(-t "$IMAGE:$TAG")
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            TAGS+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
