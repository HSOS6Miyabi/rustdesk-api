name: Verify official client installer inputs

on:
  pull_request:
    paths:
      - 'service/client_build*.go'
      - 'service/client_packages*.go'
      - 'model/client_build.go'
      - 'http/controller/api/device_commands.go'
      - 'http/router/api.go'
      - 'scripts/verify_upstream_client_commands.py'
      - 'resources/admin/app.js'
      - '.github/workflows/verify-client-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdesk-official-client-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-official-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.10'
          cache: true
      - name: Check installer profiles and artifact checksum logic
        run: go test ./service -run 'TestClientBuild|TestOfficialLinuxAndMac|TestClientSetupScript' -count=1 -v
      - name: Check native client CLI request fields across supported versions
        run: python3 scripts/verify_upstream_client_commands.py
      - name: Verify official Windows, Linux and macOS installers
        run: |
          python3 - <<'PY'
          import hashlib
          import urllib.request

          release = "https://github.com/rustdesk/rustdesk/releases/download/1.5.1/"
          files = (
              ("rustdesk-1.5.1-x86_64.exe", 26211184,
               "319206042390ebfcba934cf0baa2f612f34de463c78c843b7cb8c22097c4bf7b"),
              ("rustdesk-1.5.1-aarch64.exe", 24252784,
               "54de7328a4a2bff0b9e60d1268f7b239c45d11ab4dff4fed0c88a8a3b0fbe516"),
              ("rustdesk-1.5.1-x86_64.deb", 25337156,
               "b5d682ad90cb7571ecbdbf26eef58d3c4514e726a74ef6d08ce3f0b114ef0bd9"),
              ("rustdesk-1.5.1-aarch64.deb", 23594612,
               "d1471ed916dc21e3ae3965f936c51944e1f2635a6d521fcc466348669"),
              ("rustdesk-1.5.1-x86_64.dmg", 37691902,
               "457e4e786426d51714f8d08ce8d90815635bcd1923ab682ebfc5bc546e5b4399"),
              ("rustdesk-1.5.1-aarch64.dmg", 30548457,
               "1b94182cba2375ea29a196f2c8183f7feaa00588474ecd76c92c3ffd70d7b"),
          )
          for filename, expected_size, expected_hash in files:
              with urllib.request.urlopen(release + filename, timeout=120) as response:
                  digest = hashlib.sha256()
                  size = 0
                  prefix = b""
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      if not prefix:
                          prefix = chunk[:8]
                      size += len(chunk)
                      if size > expected_size:
                          raise RuntimeError(f"{filename}: file exceeds the pinned size")
                      digest.update(chunk)
              if filename.endswith(".exe") and not prefix.startswith(b"MZ"):
                  raise RuntimeError(f"{filename}: unexpected executable format")
              if filename.endswith(".deb") and prefix != b"!<arch>\\n":
                  raise RuntimeError(f"{filename}: unexpected Debian package format")
              if size != expected_size or digest.hexdigest() != expected_hash:
                  raise RuntimeError(f"{filename}: size or SHA-256 differs")
              print(f"{filename}: official installer verified, {size} bytes, SHA-256 {expected_hash}")
          PY
