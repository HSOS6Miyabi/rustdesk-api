name: Verify RustDesk 1.5.3 WebClient build

on:
  pull_request:
    paths:
      - '.github/workflows/verify-upstream-webclient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-official-webclient:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download official RustDesk 1.5.3 sources
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 95cca3f661f635b3cc85c04935fe8d96d8f432ef
          path: rustdesk-1.5.3
          persist-credentials: false
      - name: Install official Flutter build toolchain
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Build the official browser client
        working-directory: rustdesk-1.5.3/flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-web
          flutter create --project-name flutter_hbb --platforms web .
          flutter pub get
          flutter build web --release --base-href /webclient/
      - name: Preserve the official WebClient build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-official-1.5.3-webclient
          path: rustdesk-1.5.3/flutter/build/web
          retention-days: 7
