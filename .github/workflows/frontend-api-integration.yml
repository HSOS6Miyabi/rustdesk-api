name: Frontend-driven API integration audit

on:
  push:
    branches:
      - audit/frontend-backend-contract-20261112
  pull_request:
    paths:
      - 'resources/admin/**'
      - 'resources/web2/**'
      - 'http/**'
      - 'service/**'
      - 'scripts/frontend_api_audit.py'
      - '.github/workflows/frontend-api-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare integration test source
        shell: bash
        run: |
          if [ -f scripts/.frontend-api-audit.b64 ]; then
            python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          encoded = Path("scripts/.frontend-api-audit.b64").read_text()
          Path("scripts/test_frontend_api_contract.py").write_bytes(
              gzip.decompress(base64.b64decode(encoded)))
          Path("scripts/.frontend-api-audit.b64").unlink()
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/test_frontend_api_contract.py scripts/.frontend-api-audit.b64
            git commit -m "test: exercise browser API contracts on isolated database"
            git push origin HEAD:refs/heads/audit/frontend-backend-contract-20261112
          fi
      - name: Export repository source for isolated integration inspection
        run: |
          tar --exclude=./.git --exclude=./resources/web/main.dart.js --exclude=./docs/screenshots --exclude='*/node_modules' -czf "$RUNNER_TEMP/rustdesk-api-audit-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-api-audit-source
          path: ${{ runner.temp }}/rustdesk-api-audit-source.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and run existing interaction tests
        run: |
          node --check resources/admin/app.js
          node --check resources/web2/app.js
          node --test resources/admin/app.test.cjs resources/web2/app.test.cjs
      - name: Run existing Go tests
        run: go test ./... -count=1
      - name: Verify browser endpoints with real HTTP requests
        run: |
          go build -o /tmp/rustdesk-api-contract ./cmd/apimain.go
          python3 scripts/test_frontend_api_contract.py /tmp/rustdesk-api-contract
