name: Console development workspace
on:
  push:
    branches: [fix/console-density-device-members-20261119]
    paths: [.github/workflows/console-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: |
          mkdir -p /tmp/console-workspace
          git archive HEAD | gzip > /tmp/console-workspace/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: console-source
          path: /tmp/console-workspace/source.tar.gz
          retention-days: 3
          compression-level: 0
