name: Update README interface screenshots

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/readme-screenshots.yml
      - resources/admin/app.js
      - resources/admin/style.css
      - resources/admin/browser.e2e.cjs
      - scripts/refresh_readme_gallery.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install simplified Chinese fonts
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --silent --show-error --retry 4 --connect-timeout 20 \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf" \
            --output "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\\n' 'Noto Sans CJK SC' | grep -F 'Noto Sans CJK SC'
      - name: Install browser test framework
        run: |
          npm --prefix resources/admin install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.0
          resources/admin/node_modules/.bin/playwright install --with-deps chromium
      - name: Check screenshot preparation script
        run: python3 -m py_compile scripts/refresh_readme_gallery.py
      - name: Generate screenshots from actual web console
        run: RUSTDESK_VISUAL_AUDIT=1 RUSTDESK_REQUIRE_CJK_FONT=1 node --test resources/admin/browser.e2e.cjs
      - name: Copy selected screenshots into the documentation
        run: python3 scripts/refresh_readme_gallery.py
      - name: Prepare complete screenshot collection
        run: |
          mkdir -p screenshot-collection/readme screenshot-collection/browser-tests
          cp -a docs/screenshots/. screenshot-collection/readme/
          cp -a resources/admin/test-screenshots/. screenshot-collection/browser-tests/
          python3 - <<'PY'
          from pathlib import Path
          import csv
          import struct
          root = Path("screenshot-collection")
          images = sorted(root.rglob("*.png"))
          if len(images) < 400:
              raise SystemExit(f"Expected at least 400 screenshots, got {len(images)}")
          with (root / "screenshot-index.csv").open("w", encoding="utf-8-sig", newline="") as out:
              writer = csv.writer(out)
              writer.writerow(["文件路径", "宽度（像素）", "高度（像素）"])
              for path in images:
                  data = path.read_bytes()
                  if data[:8] != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"Invalid PNG: {path}")
                  width, height = struct.unpack(">II", data[16:24])
                  writer.writerow([path.relative_to(root), width, height])
          print(f"Prepared {len(images)} screenshots")
          PY
      - name: Upload complete screenshots as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-console-complete-screenshots
          path: screenshot-collection/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Update README screenshots in master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots/
          if git diff --cached --quiet; then
            echo "README and screenshots are already up to date."
            exit 0
          fi
          git commit -m "docs: show real administration screenshots in README"
          git push origin HEAD:master
