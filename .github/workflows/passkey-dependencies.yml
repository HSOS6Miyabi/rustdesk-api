name: Prepare WebAuthn dependencies

on:
  push:
    branches:
      - feature/passkey-profile-admin-visual-20261112
    paths:
      - go.mod
      - .github/workflows/passkey-dependencies.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve verified module versions
        run: |
          go mod tidy
          go mod verify
      - name: Save module checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m "记录 Passkey 验证库的 Go 模块校验信息"
            git push origin HEAD:feature/passkey-profile-admin-visual-20261112
          fi
