name: Verify installed Linux client deployment commands

on:
  push:
    branches:
      - development/m1-device-management
    paths:
      - 'scripts/test_official_linux_cli.py'
      - '.github/workflows/verify-native-linux-commands.yml'
  pull_request:
    paths:
      - 'scripts/test_official_linux_cli.py'
      - '.github/workflows/verify-native-linux-commands.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the verified official Linux RustDesk 1.5.1 package
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/rustdesk-1.5.1-x86_64.deb"
          curl -fLsS --retry 3 --output "$package" \
            'https://github.com/rustdesk/rustdesk/releases/download/1.5.1/rustdesk-1.5.1-x86_64.deb'
          echo "b5d682ad90cb7571ecbdbf26eef58d3c4514e726a74ef6d08ce3f0b114ef0bd9  $package" |
            sha256sum --check
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "$package"
          test "$(rustdesk --version)" = "1.5.1"
      - name: Start the installed RustDesk service
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl daemon-reload
          sudo systemctl start rustdesk.service
          sudo systemctl is-active --quiet rustdesk.service
          sudo systemctl status --no-pager rustdesk.service
      - name: Start the desktop user IPC process
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          nohup Xvfb :95 -screen 0 1280x800x24 -nolisten tcp \
            > "$RUNNER_TEMP/rustdesk-xvfb.log" 2>&1 &
          sleep 2
          export DISPLAY=:95
          nohup rustdesk --server > "$RUNNER_TEMP/rustdesk-user-server.log" 2>&1 &
          sleep 5
          pgrep -a -u "$(id -u)" rustdesk || true
          if ! pgrep -u "$(id -u)" rustdesk >/dev/null; then
            cat "$RUNNER_TEMP/rustdesk-user-server.log"
            echo "The desktop user RustDesk process did not remain available." >&2
            exit 1
          fi
          echo "DISPLAY=:95" >> "$GITHUB_ENV"
      - name: Verify official deployment and assignment requests
        shell: bash
        run: sudo -E python3 scripts/test_official_linux_cli.py
